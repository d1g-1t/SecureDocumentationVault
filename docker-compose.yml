# Non-standard ports to avoid conflicts with local dev stacks:
#   API        → 18000
#   PostgreSQL → 15432
#   Redis      → 16379
#   MinIO API  → 19000  Console → 19001
#   Flower     → 15555
#   Prometheus → 19090
#   Grafana    → 13000
#   Tempo      → 13200  OTLP → 14317
#   Loki       → 13100

x-common-env: &common-env
  env_file: .env
  environment:
    OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
    PYTHONPATH: /app

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    command: >
      uvicorn src.main:app
      --host 0.0.0.0
      --port 18000
      --loop uvloop
      --http httptools
      --access-log
    <<: *common-env
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      OTEL_SERVICE_NAME: securedocvault-api
      PYTHONPATH: /app
    ports:
      - "18000:18000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18000/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    command: >
      celery -A src.infrastructure.queue.celery_app worker
      -Q vault.ingest,vault.audit,vault.retention,vault.crypto
      -c 4
      --loglevel=info
    <<: *common-env
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      OTEL_SERVICE_NAME: securedocvault-worker
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "src.infrastructure.queue.celery_app", "inspect", "ping", "--timeout", "5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    command: >
      celery -A src.infrastructure.queue.celery_app beat
      --loglevel=info
      --scheduler celery.beat:PersistentScheduler
    <<: *common-env
    environment:
      PYTHONPATH: /app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: securedocvault
      POSTGRES_USER: sdv
      POSTGRES_PASSWORD: sdv_secret_change_me
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdv -d securedocvault"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --appendonly yes
      --requirepass redis_secret_change_me
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_secret_change_me", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minio_secret_change_me
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  flower:
    image: mher/flower:2.0
    command: >
      celery
      --broker=redis://:redis_secret_change_me@redis:6379/0
      flower
      --port=5555
      --basic_auth=admin:flower_secret
    ports:
      - "15555:5555"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "19090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.4.0
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "14317:4317"   # OTLP gRPC
      - "13200:3200"   # Tempo query
    volumes:
      - ./docker/tempo/tempo.yml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.8
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "13100:3100"
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "13000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: grafana_secret
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - tempo
      - loki
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  tempo_data:
  loki_data:
  grafana_data:
