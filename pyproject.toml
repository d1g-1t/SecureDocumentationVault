[project]
name = "securedocvault-enterprise-archive"
version = "0.1.0"
description = "Enterprise secure legal document archive for Russian legal entities with encryption, signature verification, immutable audit trail, retention policies, secure sharing, and long-term archive compliance architecture."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "SecureDocVault Team" }]

dependencies = [
  "fastapi[standard]>=0.115",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "psycopg2-binary>=2.9",
  "alembic>=1.13",
  "redis[hiredis]>=5.0",
  "celery[redis]>=5.3",
  "flower>=2.0",
  "httpx[http2]>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "dependency-injector>=4.41",
  "structlog>=24.1",
  "pyseto>=1.7",
  "passlib[bcrypt]>=1.7",
  "cryptography>=42.0",
  "minio>=7.2",
  "python-magic-bin>=0.4.14; sys_platform == 'win32'",
  "python-magic>=0.4.27; sys_platform != 'win32'",
  "pypdf>=4.2",
  "python-docx>=1.1",
  "jinja2>=3.1",
  "prometheus-client>=0.20",
  "prometheus-fastapi-instrumentator>=7.0",
  "opentelemetry-sdk>=1.24",
  "opentelemetry-api>=1.24",
  "opentelemetry-exporter-otlp>=1.24",
  "opentelemetry-instrumentation-fastapi>=0.45b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.45b0",
  "opentelemetry-instrumentation-httpx>=0.45b0",
  "opentelemetry-instrumentation-redis>=0.45b0",
  "opentelemetry-instrumentation-celery>=0.45b0",
  "slowapi>=0.1.9",
  "orjson>=3.10",
  "tenacity>=8.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "testcontainers[postgresql,redis]>=4.7",
  "respx>=0.21",
  "faker>=25.0",
  "hypothesis>=6.112",
  "ruff>=0.4",
  "mypy>=1.10",
  "bandit>=1.7",
  "safety>=3.2",
  "pre-commit>=3.7",
  "httpx>=0.27",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "S", "B", "A", "C4", "PT", "RUF"]
ignore = ["ANN101", "ANN102", "S101", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S"]
"src/scripts/**" = ["ANN", "S"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-report=html --cov-fail-under=80"

[tool.coverage.run]
source = ["src"]
omit = ["src/scripts/*", "src/main.py"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
